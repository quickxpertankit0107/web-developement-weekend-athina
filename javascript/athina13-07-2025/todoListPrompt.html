<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple To-Do List</title>
  <style>
    body {
    font-family: Arial, sans-serif;
    background: #f0f0f0;
  }

  .container {
    width: 300px;
    margin: 100px auto;
    background: #fff;
    padding: 20px;
    border-radius: 8px;
  }

  input, button {
    padding: 8px;
    margin: 5px 0;
    width: 100%;
    box-sizing: border-box;
  }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      padding: 8px;
      background: #e0e0e0;
      margin-top: 5px;
      display: flex;
      justify-content: space-between;
      flex-direction: column;
    }

  </style>
</head>
<body>
  <div class="container">
    <h2>Simple To-Do List</h2>
    <input type="text" id="taskInput" placeholder="Enter task">
    <button onclick="addTask()">Add</button>
    <button onclick="removeLast()">Remove Last</button>
    <ul id="taskList">
        <!-- all elements are added here -->
    </ul>
  </div>

  <script>
    // array empty to hold the list of tasks
    let tasks = [];

    //  function to display the list of tasks to screen
    function renderList() {
    let html = "";

    //looping through each task in the array and build list items
    for (let i = 0; i < tasks.length; i++) {
      html += `
        <li>
          ${tasks[i]} 
          <button onclick="editTask(${i})">Edit</button>
          <button onclick="deleteTask(${i})">Delete</button>
        </li>
      `;
    }
    // inject the generated HTML into the UL element
    document.getElementById("taskList").innerHTML = html;
}

    //function to add a new task using push()
    function addTask() {
      let input = document.getElementById("taskInput").value;
      if (input) {
        tasks.push(input);
        document.getElementById("taskInput").value = "";
        renderList();
      }
    }

    // function to remove the last task using pop()
    function removeLast() {
      tasks.pop();
      renderList();
    }

    // function to delete a specific task using splice()
    function deleteTask(index) {
      tasks.splice(index, 1);
      renderList();
    }

    // function to edit a specific task using splice()
      function editTask(index) {
      let newTask = prompt("Edit task:", tasks[index]);// it will fetch data from added
      if (newTask !== null && newTask.trim() !== "") {
        tasks.splice(index, 1, newTask);//array.splice(start, deleteCount, item1, item2, ..., itemN)
        // index: The position of the task you want to edit.
        // 1: This removes 1 task at that position.
        // newTask: This is the new value that replaces the old one at that position.
        renderList();
      }
    }

  </script>
</body>
</html>
