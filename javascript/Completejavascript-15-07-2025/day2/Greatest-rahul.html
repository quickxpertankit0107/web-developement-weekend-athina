    <script>


        // 2) Find Greatest of 3 numbers using Prompt

        let num1=prompt("Enter first number");

        let num2=prompt("Enter second number");
        let num3=prompt("Enter third number");



        if(Number(num1)>Number(num2) && Number(num1)>Number(num3) ){
            console.log("first number is greater",num1);
        }

        else if(Number(num2)>Number(num1) && Number(num2)>Number(num3)){
            console.log("second number is greater",num2);
        }

        else if( Number(num3)>Number(num1) && Number(num3)>Number(num2)){
            console.log("third number is greater",num3);

        }

        else{
            console.log("enter proper number");
        }
    </script>
