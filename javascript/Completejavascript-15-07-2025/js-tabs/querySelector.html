<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<p>Example 1</p>    
<p id="myParagraph">Click the button to change my color.</p>
<button id="changeColorBtn">Change Color</button>


<p>Example 2</p>
<button class="hover-btn">Hover me</button>


<script>
  const paragraph = document.querySelector('#myParagraph');
  const button = document.querySelector('#changeColorBtn');

  button.onclick = function() {
    paragraph.style.color = 'blue';
  };


  const hoverBtn = document.querySelector('.hover-btn');

  hoverBtn.onmouseenter = function() {
    hoverBtn.style.backgroundColor = 'green';
    hoverBtn.style.color = 'white';
    hoverBtn.textContent = 'Thanks!';
  };

  hoverBtn.onmouseleave = function() {
    hoverBtn.style.backgroundColor = '';
    hoverBtn.style.color = '';
    hoverBtn.textContent = 'Hover me';
  };
</script>
</body>
</html>
