<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jquery add</title>
</head>
<body>
    <button>click me</button>
    <div>
        <p>a paragraph</p>
        <p>a paragraph</p>
        <p>a paragraph</p>
        <p>a paragraph</p>
        <!--  -->
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script>
       $("button").click(function(){
        $( "div" ).add( "p" ).css( {"background-color":"red","color":"white"} ).html("hello i am add")
       })
    </script>

</body>
</html>
