<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fading in jquery</title>
    <style>
        div{
            display: flex;
            gap: 20px;
        }
        .box1{
            background-color: red;
            width: 300px;
            height: 300px;
            /* display: none;   */
            /* fadeOut(),fadeTo() dont use display none */
        }

        .box2{
            background-color: rgb(52, 120, 33);
            width: 300px;
            height: 300px;
            /* display: none;  fade in()*/
        }

        .box3{
            background-color: rgb(0, 255, 140);
            width: 300px;
            height: 300px;
            /* display: none; */
        }

        .box4{
            background-color: red;
            /* display: none; */
        }
    </style>
</head>
<body>
    
    <button class="btn">click me to slideUp</button>
    <div>
        <div class="box1">
            <h1>hello jquery</h1>
        </div>

        <!-- <div class="box2">
            <h1>hello jquery</h1>
        </div>

        <div class="box3">
            <h1>hello jquery</h1>
        </div>

        <div class="box4">
            <h1>hello jquery box4</h1>
        </div> -->
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>

    <script>
       $(".btn").click(function(){
        // $(".box1").fadeIn(2000)
        $(".box1").fadeToggle("fast")
        // $(".box1").fadeTo(5000,.4)
       })
    </script>
</body>
</html>
