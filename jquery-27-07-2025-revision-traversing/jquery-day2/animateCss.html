<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>animatecss</title>
    <style>
         .animate{
            background-color: rgb(156, 96, 96);
            width: 300px;
            height: 200px;
            position: absolute;
            display: flex;
        }
        .hello{
            position: absolute;
            left: 0;
            left: 10%;
            top: 0;
            background-color: rgb(156, 96, 96);
            width: 300px;
            height: 200px;
        }
    </style>
    
</head>
<body>
    <button id="btn1">Start Animation</button>
        <div class="hello">
            hello
        </div>

    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>

    <script>
        
            $("#btn1").click(function(){
                $('.hello').css(
                    {'position':'relative','left':'0','transition':'1s ease-in'}
                   )
            })
    </script>
</body>
</html>
